<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maison Darzi – Bespoke Tailoring &amp; Management Suite</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#28251f;--mut:#746f65;--gold:#b08d4f;--line:#e9e2d3;--soft:#f4f0e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;margin:0}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(20,25,40,.05);transition:.25s}
.gold{color:var(--gold)}.mut{color:var(--mut)}.ln{border-color:var(--line)}
.btn{padding:.6rem 1.15rem;border-radius:10px;font-weight:500;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.2s;cursor:pointer}
.btn:hover{transform:translateY(-1px);border-color:var(--gold)}
.btn.p{background:#28251f;color:#fff;border-color:#28251f}.btn.g{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.o{background:var(--card);color:var(--ink);border-color:var(--line)}
.inp{width:100%;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.875rem;outline:none}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,79,.18)}
th{font-weight:500;color:var(--mut);text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;background:var(--soft)}
td,th{padding:.8rem 1rem;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:var(--soft)}
.bd{font-size:.72rem;font-weight:500;padding:.2rem .6rem;border-radius:99px;display:inline-block}
.side{background:#fff;color:#655f54;border-right:1px solid var(--line)}.side a{display:flex;gap:.7rem;align-items:center;padding:.58rem .85rem;border-radius:10px;font-size:.88rem;transition:.2s}
.side a:hover{background:var(--soft);color:var(--ink)}.side a.on{background:#f4f0e7;color:#8f6e35;box-shadow:inset 3px 0 0 #c9a45c}
.whatsapp{position:fixed;right:1.25rem;bottom:1.25rem;z-index:40;width:3.5rem;height:3.5rem;border-radius:9999px;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:transform .2s}
.whatsapp:hover{transform:translateY(-2px)}
.hov{overflow:hidden}.hov>.in{transition:transform .6s}.hov:hover>.in{transform:scale(1.07)}
.pub a.l{opacity:.85;font-size:.85rem}.pub a.l:hover{opacity:1;color:#e3c58b}
.site-footer a{color:#f1e7d4}.site-footer a:hover{color:#d8b872}.site-footer .footer-heading{color:#d8b872}
.scroll{overflow-x:auto}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1}}.up{animation:up .5s both}
</style></head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast" class="fixed right-4 bottom-4 z-[60] space-y-2"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>'PKR '+Math.round(n).toLocaleString('en-PK');
const ST=['New Order','Measurements Pending','Fabric Pending','Cutting','Stitching','Finishing','Quality Check','Ready for Delivery','Delivered','Cancelled'];
const items=[['Italian Wool Suiting','Fabric','m',42,20,3200],['Charcoal Worsted','Fabric','m',18,20,2800],['Egyptian Cotton','Fabric','m',64,25,950],['Wash &amp; Wear Shalwar','Fabric','m',120,40,520],['Satin Lining','Lining','m',35,15,240],['Horn Buttons','Buttons','pcs',300,100,12],['YKK Zippers','Zippers','pcs',45,50,60],['Fusible Interfacing','Interfacing','m',28,15,180],['Poly Thread','Threads','roll',9,12,150],['Garment Covers','Packaging','pcs',80,30,35]].map((a,i)=>({id:i,n:a[0],cat:a[1],u:a[2],q:a[3],min:a[4],c:a[5]}));
const staffN=['Ustad Rafiq','Imran Tailor','Bilal Ahmed','Shahid Ali','Waqas Khan','Naveed Cutter','Adnan Finisher','Rizwan Helper','Sajid Embroidery','Tariq Pressman'];
const cust=['Hamza Malik','Usman Tariq','Faisal Raza','Ali Hassan','Zain Abbas','Omar Sheikh','Saad Qureshi','Hassan Butt','Kamran Akram','Adeel Iqbal','Talha Mehmood','Danish Rauf'];
const svc=[['Men\'s Formal Suit',15000,3.2],['Waistcoat',4500,1],['Shalwar Kameez',3200,2.5],['Wedding Sherwani',28000,4],['Alteration',800,0]];
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const orders=Array.from({length:16},(_,i)=>{const s=svc[i%5],p=s[1]*(.95+rnd()*.15),st=i<7?8:i<9?7:i%9==0?9:3+Math.floor(rnd()*4);
const fab=s[2]*(i%2?950:3200)*.9,lin=s[1]>4000?s[2]*240*.6:0,acc=s[1]>4000?500:120,lab=s[1]*.14,oth=s[1]*.02;
return{id:'ORD-'+(1001+i),n:1001+i,c:cust[i%12],s:s[0],price:Math.round(p),paid:st==8?Math.round(p):Math.round(p*(.3+rnd()*.4)),st,m:(i%6)+1,t:staffN[i%5],del:`${10+i} Nov 2026`,od:`${1+i} Nov 2026`,
lines:[['Fabric',fab,fab*(1+(rnd()-.4)*.1),i%2?2:0],['Lining',lin,lin,4],['Buttons &amp; accessories',acc,acc*1.1,5],['Stitching labour',lab,lab,-1],['Other',oth,oth*1.2,-1]].filter(l=>l[1]>0),used:st>=8}});
const cost=o=>o.lines.reduce((a,l)=>a+l[2],0),est=o=>o.lines.reduce((a,l)=>a+l[1],0);
const exp=[['03 Nov','Shop Rent','Monthly shop rent',60000,'Bank'],['05 Nov','Electricity','LESCO bill',18500,'Cash'],['06 Nov','Internet','Fibre connection',3500,'Bank'],['08 Nov','Equipment Maintenance','Machine servicing',7000,'Cash'],['09 Nov','Transportation','Fabric delivery',9000,'Cash'],['10 Nov','Marketing','Instagram ads',12000,'Card']];
const rev6=[['Jun',410,260],['Jul',455,285],['Aug',390,250],['Sep',520,310],['Oct',560,330],['Nov',480,300]];
const pos=['Master Tailor','Tailor','Tailor','Tailor','Tailor','Cutter','Finisher','Helper','Embroidery','Presser'],pt=['Fixed','Per suit','Fixed','Commission','Daily','Fixed','Per suit','Daily','Per suit','Daily'];
const D={staff:staffN.map((n,i)=>[n,pos[i],pt[i],(25+i*3)*1000,'Active']),
salary:staffN.map((n,i)=>[n,'Nov 2026',fmt((25+i*3)*1000),i%3?'—':fmt(5000),i<6?'Paid':i<8?'Pending':'Partial']),
expenses:exp.map(e=>[e[0],e[1],e[2],fmt(e[3]),e[4]]),
customers:cust.map((n,i)=>{const o=orders.filter(x=>x.c==n&&x.st<9);return[n,'0300-'+(1200000+i*83711),o.length,fmt(o.reduce((a,x)=>a+x.price,0)),fmt(o.reduce((a,x)=>a+x.price-x.paid,0))]}),
measurements:cust.map((n,i)=>[n,i%3?'Formal Suit':'Shalwar Kameez',(38+i%6)+'"',(32+i%6)+'"',(24+i%3)+'"','0'+(1+i%9)+' Nov']),
suppliers:[['Bombay Cloth House','Mr. Aslam','Fabrics',fmt(185000),'Active'],['Lahore Fabric Mart','Mr. Javed','Fabrics',fmt(92000),'Active'],['Al-Karim Trimmings','Mr. Kareem','Buttons, zips',fmt(14500),'Active'],['Star Thread Co.','Ms. Sana','Threads',0,'Paid']],
purchases:[['PO-2201','Bombay Cloth House','Italian Wool x30m',fmt(96000),'Received'],['PO-2202','Lahore Fabric Mart','Egyptian Cotton x50m',fmt(47500),'Received'],['PO-2203','Al-Karim Trimmings','Horn Buttons x500',fmt(6000),'Received'],['PO-2204','Bombay Cloth House','Charcoal Worsted x25m',fmt(70000),'Pending'],['PO-2205','Star Thread Co.','Poly Thread x20',fmt(3000),'Received']]};
const M={staff:['Staff','Name,Position,Pay type,Monthly (PKR),Status','user-round'],salary:['Salary Payments','Employee,Month,Amount,Advance,Status','banknote'],expenses:['Business Expenses','Date,Category,Description,Amount,Method','receipt'],customers:['Customers','Name,Phone,Orders,Total purchases,Outstanding','users'],measurements:['Measurements','Customer,Profile,Chest,Waist,Sleeve,Updated','ruler'],suppliers:['Suppliers','Supplier,Contact,Category,Payable,Status','truck'],purchases:['Purchases','PO,Supplier,Item,Amount,Status','shopping-cart']};
const SETTINGS_KEY='maison-darzi-business-settings';
const defaults={whatsapp:'923000000000',phone:'+92 300 0000000',email:'',address:'Main Boulevard, Gulberg III, Lahore',instagram:'',facebook:'',otherSocial:''};
const business=Object.assign({},defaults,JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=s=>String(s||'').replace(/\D/g,'');
const customerHash=s=>encodeURIComponent(s).replace(/'/g,'%27');
const safeUrl=s=>/^https?:\/\//i.test(String(s||''))?String(s):'';
const waHref=()=>`https://wa.me/${digits(business.whatsapp)}?text=${encodeURIComponent('Assalam-o-Alaikum, I would like to enquire about bespoke tailoring.')}`;
const stC=i=>i<3?['#a76a12','#fbf0dc']:i<7?['#2457a6','#e4edfa']:i==7?['#0e7a6c','#dff5f1']:i==8?['#27733a','#e2f4e6']:['#a8362c','#fae4e1'];
const bdg=(t,c)=>`<span class="bd" style="color:${c[0]};background:${c[1]}">${t}</span>`,sb=i=>bdg(ST[i],stC(i));
const wc={Active:8,Paid:8,Received:8,Pending:0,Partial:3,Overdue:9};
const cell=v=>v in wc?bdg(v,stC(wc[v])):v;
const S={q:'',p:0,fs:''};
function toast(t){const d=document.createElement('div');d.className='card px-4 py-3 text-sm flex gap-2 items-center up';d.innerHTML='<i data-lucide="check-circle-2" class="w-4 h-4 gold"></i>'+t;$('#toast').append(d);lucide.createIcons();setTimeout(()=>d.remove(),2800)}
const closeM=()=>$('#modal').innerHTML='';
const shell=h=>`<div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(10,14,26,.6);backdrop-filter:blur(3px)" onclick="if(event.target==this)closeM()"><div class="card w-full max-w-md p-6 up">${h}</div></div>`;
function cfm(msg,fn){window.cb=fn;$('#modal').innerHTML=shell(`<div class="serif text-2xl mb-2">Please confirm</div><p class="mut text-sm mb-5">${msg}</p><div class="flex gap-2 justify-end"><button class="btn" onclick="closeM()">Cancel</button><button class="btn p" onclick="closeM();cb()">Confirm</button></div>`)}
function addRow(k){if(k==='customers')return addCustomer();const c=M[k][1].split(',');$('#modal').innerHTML=shell(`<div class="serif text-2xl mb-4">Add to ${M[k][0]}</div><div class="grid gap-3">${c.map((x,i)=>`<label class="text-xs mut">${x}<input class="inp mt-1 f" placeholder="${x}"></label>`).join('')}</div><div class="flex gap-2 justify-end mt-5"><button class="btn" onclick="closeM()">Cancel</button><button class="btn g" onclick="saveRow('${k}')">Save</button></div>`)}
function saveRow(k){const v=[...document.querySelectorAll('.f')].map(e=>e.value.trim());if(!v[0])return toast('Please fill in the first field');D[k].unshift(v);closeM();toast('Record added');route()}
const customerInfo={};
function addCustomer(){const profiles=['Men’s Suit','Waistcoat','Shalwar Kameez','Wedding & Formal','Other'];$('#modal').innerHTML=shell(`<div class="serif text-2xl mb-4">Add customer and measurements</div><div class="grid sm:grid-cols-2 gap-3"><label class="text-xs mut">Full name<input id="cName" class="inp mt-1" required></label><label class="text-xs mut">Phone / WhatsApp<input id="cPhone" class="inp mt-1" type="tel" required></label><label class="text-xs mut">Email<input id="cEmail" class="inp mt-1" type="email"></label><label class="text-xs mut">Address<input id="cAddress" class="inp mt-1"></label><label class="text-xs mut">Measurement profile<select id="cProfile" class="inp mt-1">${profiles.map(p=>`<option>${p}</option>`).join('')}</select></label><label class="text-xs mut">Chest (in)<input id="cChest" class="inp mt-1" placeholder="Optional"></label><label class="text-xs mut">Waist (in)<input id="cWaist" class="inp mt-1" placeholder="Optional"></label><label class="text-xs mut">Sleeve (in)<input id="cSleeve" class="inp mt-1" placeholder="Optional"></label></div><div class="flex gap-2 justify-end mt-5"><button class="btn" onclick="closeM()">Cancel</button><button class="btn g" onclick="saveCustomer()">Save customer</button></div>`)}
function saveCustomer(){const name=$('#cName').value.trim(),phone=$('#cPhone').value.trim();if(!name||!phone)return toast('Please enter the customer name and phone number');if(D.customers.some(c=>c[0].toLowerCase()===name.toLowerCase()))return toast('A customer with this name already exists');const profile=$('#cProfile').value,measurement=[name,profile,$('#cChest').value.trim(),$('#cWaist').value.trim(),$('#cSleeve').value.trim(),new Date().toLocaleDateString()];D.customers.unshift([name,phone,0,fmt(0),fmt(0)]);D.measurements.unshift(measurement);customerInfo[name]={email:$('#cEmail').value.trim(),address:$('#cAddress').value.trim()};closeM();toast('Customer and measurements added');location.hash='admin-customer-'+encodeURIComponent(name)}
function customersPage(){const l=D.customers.filter(c=>c.join(' ').toLowerCase().includes(S.q.toLowerCase())),pg=l.slice(S.p*7,S.p*7+7);return adm('customers','Customers',`${D.customers.length} customer records`,`<div class="flex mb-4"><div class="flex-1"></div><button class="btn g" onclick="addCustomer()">+ Add customer</button></div><div class="card scroll">${l.length?`<table class="w-full text-sm"><thead><tr><th>Name</th><th>Phone</th><th>Orders</th><th>Total purchases</th><th>Outstanding</th><th></th></tr></thead><tbody>${pg.map(c=>`<tr class="cursor-pointer" onclick="location.hash='admin-customer-${customerHash(c[0])}'"><td class="font-medium">${esc(c[0])}</td><td>${esc(c[1])}</td><td>${esc(c[2])}</td><td>${esc(c[3])}</td><td>${esc(c[4])}</td><td><button class="btn !py-1 !px-2" onclick="event.stopPropagation();location.hash='admin-customer-${customerHash(c[0])}'">Profile</button></td></tr>`).join('')}</tbody></table>${pager(l.length,7)}`:empty}</div>`)}
function customerProfile(name){const c=D.customers.find(x=>x[0]===name);if(!c)return customersPage();const m=D.measurements.filter(x=>x[0]===name),os=orders.filter(o=>o.c===name),info=customerInfo[name]||{};return adm('customers',esc(name),`<a href="#admin-customers" class="gold">← All customers</a> · Customer profile`,`<div class="grid lg:grid-cols-3 gap-4 mb-4"><div class="card p-5"><div class="font-medium mb-3">Personal details</div><div class="text-sm space-y-2"><div>Phone: ${esc(c[1])}</div><div>Email: ${esc(info.email||'—')}</div><div>Address: ${esc(info.address||'—')}</div></div></div><div class="card p-5"><div class="font-medium mb-3">Order summary</div><div class="text-sm space-y-2"><div>${os.length} related orders</div><div>Total purchases: ${esc(c[3])}</div><div>Outstanding: ${esc(c[4])}</div></div></div><div class="card p-5"><div class="font-medium mb-3">Measurements</div>${m.length?m.map(x=>`<div class="border-b ln py-2 text-sm"><div class="font-medium">${esc(x[1])} <span class="mut text-xs">· updated ${esc(x[5])}</span></div><div class="mut">Chest ${esc(x[2]||'—')} · Waist ${esc(x[3]||'—')} · Sleeve ${esc(x[4]||'—')} in</div></div>`).join(''):'<div class="mut text-sm">No measurements recorded</div>'}</div></div><div class="card scroll"><div class="p-5 font-medium">Related orders</div>${os.length?`<table class="w-full text-sm"><thead><tr><th>Order</th><th>Service</th><th>Order date</th><th>Delivery</th><th>Price</th><th>Paid</th><th>Status</th></tr></thead><tbody>${os.map(o=>`<tr class="cursor-pointer" onclick="location.hash='order-${o.n}'"><td>${o.id}</td><td>${o.s}</td><td>${o.od}</td><td>${o.del}</td><td>${fmt(o.price)}</td><td>${fmt(o.paid)}</td><td>${sb(o.st)}</td></tr>`).join('')}</tbody></table>`:'<div class="p-5 mut text-sm">No related orders yet</div>'}</div>`)}
function delRow(k,i){cfm('This record will be removed from the demo.',()=>{D[k].splice(i,1);toast('Record deleted');route()})}
function advance(id){const o=orders.find(x=>x.id==id);if(o.st<8){o.st++;if(o.st==8)o.paid=o.price;toast(o.id+' moved to '+ST[o.st]);route()}}
function useMat(id){const o=orders.find(x=>x.id==id);if(o.used)return toast('Already confirmed. Stock is never deducted twice.');o.used=true;
o.lines.filter(l=>l[3]>=0).forEach(l=>{const it=items[l[3]];it.q=Math.max(0,+(it.q-l[1]/it.c).toFixed(1))});toast('Materials confirmed and stock deducted');route()}
function fin(){const d=orders.filter(o=>o.st==8),rev=d.reduce((a,o)=>a+o.price,0),pc=d.reduce((a,o)=>a+cost(o),0),act=orders.filter(o=>o.st<9),op=exp.reduce((a,e)=>a+e[3],0),sal=50000;
return{rev,pc,cash:act.reduce((a,o)=>a+o.paid,0),op,sal,net:rev-pc-op-sal,pend:act.reduce((a,o)=>a+o.price-o.paid,0),inv:items.reduce((a,i)=>a+i.q*i.c,0),low:items.filter(i=>i.q<i.min)}}
const jacket=(f,s)=>`<svg viewBox="0 0 400 480" fill="none"><path d="M155 70L200 52L245 70L322 108L344 300L300 312L290 200L286 440H114L110 200L100 312L56 300L78 108Z" fill="${f}" stroke="${s}" stroke-width="2"/><path d="M200 52L162 170L200 262L238 170Z" fill="rgba(255,255,255,.1)" stroke="${s}"/><path d="M162 170L130 120M238 170L270 120" stroke="${s}"/><circle cx="200" cy="320" r="5" fill="${s}"/><circle cx="200" cy="370" r="5" fill="${s}"/><path d="M130 250h40v26h-40z" stroke="${s}" opacity=".6"/></svg>`;
const sw=[['Navy Pinstripe','background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(255,255,255,.22) 11px 12px),#1b2a4a','Suits'],['Charcoal Herringbone','background:repeating-linear-gradient(60deg,#3b3f48 0 4px,#2a2d35 4px 8px),#2a2d35','Suits'],['Ivory Linen','background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 5px),#d9cdb4','Waistcoats'],['Houndstooth','background:conic-gradient(#222 25%,#e9e2d3 0 50%,#222 0 75%,#e9e2d3 0) 0 0/28px 28px','Formal'],['Burgundy Velvet','background:radial-gradient(circle at 30% 20%,#8a2f46,#4a1424)','Wedding'],['Windowpane Check','background:linear-gradient(90deg,rgba(201,164,92,.5) 2px,transparent 2px) 0 0/34px 34px,linear-gradient(rgba(201,164,92,.5) 2px,transparent 2px) 0 0/34px 34px,#33415f','Formal']];
const pub=()=>`<div class="pub"><header class="absolute top-0 inset-x-0 z-20 flex justify-between items-center px-5 md:px-12 py-5 text-white"><a href="#home" class="flex items-center gap-3"><span class="w-10 h-10 rounded-full border border-[#c9a45c] flex items-center justify-center serif text-xl text-[#e3c58b]">M</span><span class="serif text-2xl tracking-wide">Maison Darzi</span></a><nav class="hidden md:flex gap-8"><a class="l" href="#home">Collections</a><a class="l" href="#craft">Craftsmanship</a><a class="l" href="#packages">Pricing</a><a class="l" href="#book">Contact</a></nav><div class="flex gap-2"><a href="#book" class="btn g">Book a fitting</a><a href="#admin-dashboard" class="btn o hidden sm:block">Owner login</a></div></header>
<section class="relative min-h-[92vh] flex items-center text-white overflow-hidden" style="background:radial-gradient(circle at 75% 40%,#2b3a63,#101728 70%)"><div class="absolute inset-0 opacity-20" style="background:repeating-linear-gradient(90deg,transparent 0 38px,#c9a45c 38px 39px)"></div><div class="absolute right-[-60px] md:right-[6%] top-[14%] w-[340px] md:w-[460px] opacity-60 md:opacity-100">${jacket('rgba(255,255,255,.04)','#c9a45c')}</div>
<div class="relative px-5 md:px-12 pt-28 pb-20 max-w-3xl up"><div class="text-[#e3c58b] text-xs tracking-[.35em] uppercase mb-5">Bespoke tailoring · Est. 1987 · Lahore</div><h1 class="serif text-5xl md:text-7xl leading-[1.05]">Crafting Elegance, <i class="text-[#e3c58b]">One Stitch</i> at a Time</h1><p class="mt-6 text-white/75 max-w-xl">Hand-finished suits, sherwanis and shalwar kameez, cut to your exact measure by three generations of master tailors.</p><div class="mt-9 flex gap-3 flex-wrap"><a href="#collections" class="btn g">Explore Collections</a><a href="#book" class="btn o">Book an Appointment</a></div>

function route(keep){const h=(location.hash||'#home').slice(1);let html;
